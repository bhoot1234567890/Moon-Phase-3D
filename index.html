<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lunar Phases</title>
  </head>
  <body>
    <canvas id="bg"></canvas>
    <div id="info">
      <span id="title_en">Phases of the Moon</span><br />
      <span id="title_hi">चंद्र चलाएं/चंद्रमा की कलाएं</span>
      <div id="controls">
        <button id="btn">Reset View</button>
        <button id="featureToggle" class="feature-toggle" aria-pressed="false" title="Show or hide the extra features">✨ Features</button>
      </div>
    </div>
    <div id="curr_phase_name"></div>

    <!-- Custom date picker (bottom-right). calendar.js (imported by main.js) owns it. -->
    <div id="datePicker" class="date-picker">
      <button type="button" id="dateTrigger" class="date-trigger" aria-haspopup="dialog" aria-expanded="false">
        <svg class="date-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="3" y="4.5" width="18" height="16.5" rx="3" />
          <path d="M3 9.5h18M8 2.5v4M16 2.5v4" />
          <circle cx="8.5" cy="13.5" r="1.1" fill="currentColor" stroke="none" />
          <circle cx="12" cy="13.5" r="1.1" fill="currentColor" stroke="none" />
          <circle cx="15.5" cy="13.5" r="1.1" fill="currentColor" stroke="none" />
        </svg>
        <span id="dateLabel">—</span>
      </button>
      <div id="datePanel" class="date-panel" role="dialog" aria-label="Pick a date" hidden>
        <div class="dp-header">
          <button type="button" id="dpPrev" class="dp-nav" aria-label="Previous month">‹</button>
          <span id="dpTitle" class="dp-title">—</span>
          <button type="button" id="dpNext" class="dp-nav" aria-label="Next month">›</button>
        </div>
        <div class="dp-weekdays" aria-hidden="true">
          <span>S</span><span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span>
        </div>
        <div id="dpGrid" class="dp-grid"></div>
        <button type="button" id="dpToday" class="dp-today-btn">Today</button>
      </div>
    </div>

    <!-- Shared feature toolbar (top-right); feature modules append buttons here -->
    <div id="toolbar" class="toolbar"></div>

    <script type="module" src="/main.js"></script>
  </body>
</html>
